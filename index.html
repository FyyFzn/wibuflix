<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WibuFlix — Nonton streaming anime sub indo terlengkap dan terbaru.">
    <title>WibuFlix — Nonton Anime Sub Indo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 id="logoTitle">WIBU<span>FLIX</span></h1>
        <div class="topbar-right">
            <div class="history-topbar" id="historyTopbar">
                <button class="history-icon-btn" id="historyIconBtn" title="Riwayat Tontonan">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </button>
                <div class="history-dropdown" id="historyDropdown">
                    <div class="history-dropdown-header">Riwayat Tontonan</div>
                    <div id="historyDropdownList"></div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Loading Overlay -->
        <div id="loading" class="hidden">
            <div class="loading-spinner"></div>
            <p id="loadingText">Memuat data...</p>
        </div>

        <!-- ── LAYAR 1: KATALOG ── -->
        <div id="layarKatalog">
            <div class="katalog-header">
                <h2>Perpustakaan Anime</h2>
                <div class="search-box">
                    <input type="text" id="inputSearch" placeholder="Cari judul anime...">
                    <button id="btnSearch">Cari</button>
                </div>
            </div>

            <div id="katalogGrid" class="katalog-grid"></div>

            <div class="pagination-area">
                <button id="btnPagePrev" class="btn-nav" disabled>« Sebelumnya</button>
                <span id="pageInfo" class="page-info">Hal 1</span>
                <button id="btnPageNext" class="btn-nav">Selanjutnya »</button>
            </div>

        </div>

        <!-- ── LAYAR 2: DAFTAR EPISODE ── -->
        <div id="layarDaftarEpisode" class="hidden">
            <button id="btnKembaliKatalog" class="btn-back">← Kembali ke Katalog</button>

            <!-- Panel Info MAL -->
            <div id="malPanel" class="mal-panel hidden">
                <img id="malCover" class="mal-cover" src="" alt="">
                <div class="mal-info">
                    <h2 id="judulSeriAnime" class="mal-title"></h2>
                    <div class="mal-meta">
                        <span id="malScore" class="mal-score hidden">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fcd34d"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            <span id="malScoreVal"></span>
                        </span>
                        <span id="malStatus" class="mal-tag hidden"></span>
                        <span id="malYear" class="mal-tag hidden"></span>
                        <span id="malEps" class="mal-tag hidden"></span>
                        <a id="malLink" class="mal-link hidden" href="#" target="_blank" rel="noopener">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
                            MAL
                        </a>
                    </div>
                    <div id="malGenres" class="mal-genres"></div>
                    <p id="malSynopsis" class="mal-synopsis hidden"></p>
                    <div id="malStudios" class="mal-studios hidden"></div>
                    <button id="btnToggleSynopsis" class="btn-toggle-synopsis hidden">Tampilkan sinopsis ▾</button>
                </div>
            </div>

            <!-- Judul fallback jika tidak ada MAL -->
            <h2 id="judulSeriAnimeFallback" class="title-area hidden"></h2>

            <div class="eps-controls">
                <div class="eps-search-box">
                    <input type="text" id="inputEpsSearch" placeholder="Cari episode...">
                </div>
                <button id="btnEpsSort" class="btn-sort" title="Urutan episode">
                    Terbaru ↑
                </button>
            </div>
            <div id="epsListContainer" class="eps-grid"></div>
        </div>


        <!-- ── LAYAR 3: PLAYER ── -->
        <div id="layarPlayer" class="hidden">
            <button id="btnKembaliEps" class="btn-back">← Kembali</button>
            <h2 id="judulEpisode" class="title-area"></h2>

            <div class="player-wrapper" id="playerWrapper">
                <!-- Overlay loading saat ganti server -->
                <div id="playerOverlay" class="player-overlay">
                    <div class="loading-spinner"></div>
                </div>
                
                <!-- Overlay navigasi cepat di dalam pemutar -->
                <button id="overlayBtnPrev" class="overlay-nav-btn left hidden" title="Episode Sebelumnya">«</button>
                <button id="overlayBtnNext" class="overlay-nav-btn right hidden" title="Episode Selanjutnya">»</button>

                <iframe id="embedPlayer" src="" allowfullscreen></iframe>
                <video id="nativePlayer" controls autoplay style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; background: #000;"></video>
            </div>

            <div class="server-selection">
                <p class="server-label">Pilih Server:</p>
                <div id="serverList" class="server-list"></div>
            </div>

            <div class="player-nav">
                <button id="btnPrev" class="btn-nav" disabled>« Ep Sebelumnya</button>
                <button id="btnNext" class="btn-nav" disabled>Ep Selanjutnya »</button>
            </div>
        </div>

        <!-- ── LAYAR 4: HISTORY ── -->
        <div id="layarHistory" class="hidden">
            <button id="btnKembaliDariHistory" class="btn-back">← Kembali ke Katalog</button>
            <h2 class="title-area">Riwayat Tontonan</h2>
            <div id="historyGrid" class="katalog-grid"></div>
            <div class="pagination-area" id="historyPaginationArea">
                <button id="btnHistoryPrev" class="btn-nav" disabled>« Sebelumnya</button>
                <span id="historyPageInfo" class="page-info">Hal 1</span>
                <button id="btnHistoryNext" class="btn-nav" disabled>Selanjutnya »</button>
            </div>
        </div>
    </main>
    <!-- External Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- Main Script -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
