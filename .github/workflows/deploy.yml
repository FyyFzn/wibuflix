name: Build and Deploy WibuFlix to Azure

on:
  push:
    branches: [main]  # ganti ke "master" kalau branch kamu master

# Membatalkan workflow lama jika ada push baru, untuk mencegah versi lama menimpa versi baru
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/wibuflix:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/wibuflix:latest
