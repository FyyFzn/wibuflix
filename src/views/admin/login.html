<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WibuFlix Admin Login</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #1f6feb;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
            --accent-purple: #8957e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header h1 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-header p {
            font-size: 13px;
            color: var(--text-muted);
        }
        .error-banner {
            background-color: rgba(218, 54, 51, 0.15);
            border: 1px solid var(--accent-red);
            color: #ff7b72;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 10px 14px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
        }
        button.btn-login {
            width: 100%;
            background-color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            color: #fff;
            padding: 11px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }
        button.btn-login:hover {
            background-color: #388bfd;
            border-color: #388bfd;
        }
        button.btn-login:active {
            background-color: #1a56be;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>🚀 WIBUFLIX ADMIN</h1>
            <p>Masukkan kata sandi admin untuk mengakses Command Center.</p>
        </div>

        <!--ERROR_BANNER-->

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="password">Kata Sandi Admin</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" required autofocus autocomplete="current-password" />
            </div>
            <button type="submit" class="btn-login">Masuk ke Command Center ➔</button>
        </form>

        <div class="footer-note">
            Wibuflix Infrastructure Management &bull; Akses Terbatas
        </div>
    </div>
</body>
</html>
